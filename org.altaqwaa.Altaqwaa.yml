app-id: org.altaqwaa.Altaqwaa
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: "25.08"
command: run.sh
separate-locales: false
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
  - --share=network
  - --talk-name=org.freedesktop.Notifications
  # - --own-name=org.kde.* # Needed for system tray on KDE Wayland session
modules:
  - name: altaqwaa
    buildsystem: simple
    build-commands:
      - mv * /app/bin
      - mkdir -p /app/share/icons/hicolor/256x256/apps/
      - mkdir -p /app/share/applications
      - mkdir -p /app/share/metainfo
      - mv /app/bin/${FLATPAK_ID}.png /app/share/icons/hicolor/256x256/apps/
      - mv /app/bin/${FLATPAK_ID}.desktop /app/share/applications/
      - mv /app/bin/${FLATPAK_ID}.metainfo.xml /app/share/metainfo
    sources:
      - type: archive
        url: https://github.com/rn0x/altaqwaa-desktop/releases/download/v4.0.0/altaqwaa-4.0.0.tar.gz
        sha256: 99e2e4dfd066f1ee1f6c4cda9cd9f8378da2d372f6e037f94a69c5d150282b12
      # Wrapper to launch the app
      - type: file
        path: run.sh
      - type: file
        path: org.altaqwaa.Altaqwaa.desktop
      - type: file
        path: org.altaqwaa.Altaqwaa.png
      - type: file
        path: org.altaqwaa.Altaqwaa.metainfo.xml
